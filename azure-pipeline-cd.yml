trigger:
  branches:
    include:
      - develop

resources:
  repositories:
    - repository: devops
      type: git
      name: Devops

extends:
  template: templates/build-microservice.yml@devops
  parameters:
    appName: "restabarlabello-admin"
    imageRepository: "restabarlabello-admin"
    secretFileName: "restabarlabello-admin-secret.yaml"
    deploymentType: "frontend"
    backendAppName: "restabarlabello-backend"
    subdomain: "admin-restabarlabello"
