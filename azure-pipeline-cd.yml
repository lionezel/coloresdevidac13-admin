trigger:
  branches:
    include:
      - develop

resources:
  repositories:
    - repository: devops
      type: git
      name: Devops

extends:
  template: templates/build-microservice.yml@devops
  parameters:
    appName: "coloresdevida-admin"
    imageRepository: "coloresdevida-admin"
    secretFileName: "coloresdevida-admin-secret.yaml"
    deploymentType: "frontend"
    backendAppName: "coloresdevida-backend"
    subdomain: "admin-coloresdevida"
