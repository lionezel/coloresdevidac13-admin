kind: Service
apiVersion: v1
metadata:
  name: #{name}#
  namespace: #{environment}#
  labels:
    app: #{name}#
spec:
  ports:
    - port: #{port}#
      targetPort: #{port}#
  selector:
    app: #{name}#
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{name}#
  labels:
    app: #{name}#
  namespace: #{environment}#
spec:
  replicas: #{replicas}#
  selector:
    matchLabels:
      app: #{name}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template: 
    metadata:
      labels:
        app: #{name}#
    spec:
      containers:
        - name: #{name}#
          image: #{registry}#/#{repositoryName}#:#{version}#
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "#{requestCpu}#"
              memory: "#{requestMemory}#"
            limits:
              cpu: "#{limitCpu}#"
              memory: "#{limitMemory}#"                                        
          ports:
            - containerPort: #{port}# 
      restartPolicy: Always
